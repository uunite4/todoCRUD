<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Todo (full CRUD)</title>
  </head>
  <body>
    <!--  --=+ MODALS +=--  -->
    <!-- Add Todo Modal -->
    <div class="modal-cont todomodal">
      <div class="xbtn create-todo">X</div>
      <div class="modal-part">
        <h1 class="modal-title">What do you wanna do?</h1>
        <input type="text" class="todo-name-input" />
      </div>
      <div class="modal-part">
        <h1 class="modal-title">What category does your task fit into?</h1>
        <div class="select-cat-btn-cont">
          <p>CATEGORY SELECTED: <span></span></p>
          <div>
            <button class="select-cat-btn cat-btn">Select Category</button>
            <button class="create-cat-btn cat-btn">+</button>
          </div>
        </div>
      </div>
      <button class="create-todo-btn">+ create todo</button>
    </div>

    <!-- Select Category Modal -->
    <div class="category-modal"></div>

    <div class="blackscreen"></div>
    <!--  --=+ MAIN BODY +=--  -->
    <div class="cont">
      <div class="mid-cont">
        <div class="title-cont">
          <div class="top">
            <h1>TODO LIST</h1>
            <button class="add-btn">+</button>
          </div>
          <div class="bottom"><p class="filters">FILTERS: NONE</p></div>
        </div>

        <div class="todo-cont"></div>
      </div>
    </div>
  </body>
</html>
